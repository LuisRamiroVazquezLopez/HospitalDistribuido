services:
  shard1-a:
    image: mongo:7.0
    container_name: shard1-a
    ports:
      - "27201:27201"
    volumes:
      - shard1-a-datos:/data/db
      - ../mongo/keyfile:/etc/mongo/keyfile-origen:ro
    command: 
      - bash
      - -c
      - |
        set -e
        cp /etc/mongo/keyfile-origen /tmp/keyfile
        chmod 400 /tmp/keyfile
        chown 999:999 /tmp/keyfile
        exec docker-entrypoint.sh mongod --replSet rs-shard1 --port "27201" --bind_ip_all --shardsvr --keyFile /tmp/keyfile

  shard2-a:
    image: mongo:7.0
    container_name: shard2-a
    ports:
      - "27301:27301"
    volumes:
      - shard2-a-datos:/data/db
      - ../mongo/keyfile:/etc/mongo/keyfile-origen:ro
    command: 
      - bash
      - -c
      - |
        set -e
        cp /etc/mongo/keyfile-origen /tmp/keyfile
        chmod 400 /tmp/keyfile
        chown 999:999 /tmp/keyfile
        exec docker-entrypoint.sh mongod --replSet rs-shard2 --port "27301" --bind_ip_all --shardsvr --keyFile /tmp/keyfile
  
  cfg1:
    image: mongo:7.0
    container_name: cfg1
    ports:
      - "27101:27101"
    volumes:
      - cfg1-datos:/data/configdb
      - ../mongo/keyfile:/etc/mongo/keyfile-origen:ro
    command: 
      - bash
      - -c
      - |
        set -e
        cp /etc/mongo/keyfile-origen /tmp/keyfile
        chmod 400 /tmp/keyfile
        chown 999:999 /tmp/keyfile
        exec docker-entrypoint.sh mongod --configsvr --replSet rs-config --port "27101" --bind_ip_all --keyFile /tmp/keyfile
  mongos1:
    image: mongo:7.0
    container_name: mongos1
    ports:
      - "27017:27017"
    volumes:
      - ../mongo/keyfile:/etc/mongo/keyfile-origen:ro
    command:
      - bash
      - -c
      - |
        set -e
        cp /etc/mongo/keyfile-origen /tmp/keyfile
        chmod 400 /tmp/keyfile
        chown 999:999 /tmp/keyfile
        exec docker-entrypoint.sh mongos --configdb rs-config/${PC1_IP}:27101,${PC2_IP}:27102,${PC3_IP}:27103 --port 27017 --bind_ip_all --keyFile /tmp/keyfile

volumes:
  shard1-a-datos:
  shard2-a-datos:
  cfg1-datos: