services:
  shard1-b:
    image: mongo:7.0
    container_name: shard1-b
    ports:
      - "27202:27202"
    volumes:
      - shard1-b-datos:/data/db
      - ../mongo/keyfile:/etc/mongo/keyfile-origen:ro
    command: 
      - bash
      - -c
      - |
        set -e
        cp /etc/mongo/keyfile-origen /tmp/keyfile
        chmod 400 /tmp/keyfile
        chown 999:999 /tmp/keyfile
        exec docker-entrypoint.sh mongod --replSet rs-shard1 --port "27202" --bind_ip_all --shardsvr --keyFile /tmp/keyfile
  shard2-b:
    image: mongo:7.0
    container_name: shard2-b
    ports:
      - "27302:27302"
    volumes:
      - shard2-b-datos:/data/db
      - ../mongo/keyfile:/etc/mongo/keyfile-origen:ro
    command: 
      - bash
      - -c
      - |
        set -e
        cp /etc/mongo/keyfile-origen /tmp/keyfile
        chmod 400 /tmp/keyfile
        chown 999:999 /tmp/keyfile
        exec docker-entrypoint.sh mongod --replSet rs-shard2 --port "27302" --bind_ip_all --shardsvr --keyFile /tmp/keyfile
  cfg2:
    image: mongo:7.0
    container_name: cfg2
    ports:
      - "27102:27102"
    volumes:
      - cfg2-datos:/data/configdb
      - ../mongo/keyfile:/etc/mongo/keyfile-origen:ro
    command: 
      - bash
      - -c
      - |
        set -e
        cp /etc/mongo/keyfile-origen /tmp/keyfile
        chmod 400 /tmp/keyfile
        chown 999:999 /tmp/keyfile
        exec docker-entrypoint.sh mongod --configsvr --replSet rs-config --port "27102" --bind_ip_all --keyFile /tmp/keyfile

  mongos2:
    image: mongo:7.0
    container_name: mongos2
    ports:
      - "27018:27018"
    volumes:
      - ../mongo/keyfile:/etc/mongo/keyfile-origen:ro
    command:
      - bash
      - -c
      - |
        set -e
        cp /etc/mongo/keyfile-origen /tmp/keyfile
        chmod 400 /tmp/keyfile
        chown 999:999 /tmp/keyfile
        exec docker-entrypoint.sh mongos --configdb rs-config/${PC1_IP}:27101,${PC2_IP}:27102,${PC3_IP}:27103 --port 27018 --bind_ip_all --keyFile /tmp/keyfile
volumes:
  shard1-b-datos:
  shard2-b-datos:
  cfg2-datos: